name: Bilingual Auto Blog Bot

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Claude Haiku Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py
      - name: Commit and Push Posts
        run: |
          git config user.name "AI Editor Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Auto-publish Arabic & English articles via Claude" || exit 0
          git push
