name: Bilingual Auto Blog Bot

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-generativeai

      - name: Run Gemini Blog Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py

      - name: Commit and Push Posts
        run: |
          git config --global user.name "Auto Blog Bot"
          git config --global user.email "bot@youlaa24.github.io"
          git add _posts/ history.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-publish new bilingual articles" && git pull origin main --rebase && git push origin main)
