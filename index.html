<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخطاطات الذهنية | YouStor Edu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="bg-blue-700 text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-extrabold mb-2">منصة الخطاطات الذهنية</h1>
        <p class="text-blue-200">YouStor Edu - لجميع المستويات الابتدائية</p>
    </header>

    <main class="max-w-4xl mx-auto mt-8 p-4">
        
        <!-- اختيار المادة -->
        <div class="mb-6 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4">1. اختر المادة الدراسية:</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="subjects-container">
                <button onclick="selectSubject('اللغة العربية')" class="bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-800 py-3 rounded-lg font-semibold transition">اللغة العربية</button>
                <button onclick="selectSubject('اللغة الفرنسية')" class="bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-800 py-3 rounded-lg font-semibold transition">اللغة الفرنسية</button>
                <button onclick="selectSubject('الرياضيات')" class="bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-800 py-3 rounded-lg font-semibold transition">الرياضيات</button>
                <button onclick="selectSubject('النشاط العلمي')" class="bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-800 py-3 rounded-lg font-semibold transition">النشاط العلمي</button>
            </div>
        </div>

        <!-- عرض الاختيارات -->
        <div id="selection-area" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-100 fade-in mb-6">
            <h3 id="selected-title" class="text-2xl font-bold text-blue-700 mb-6 border-b pb-2"></h3>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- المستوى -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">المستوى الدراسي:</label>
                    <select id="level-select" class="w-full border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option value="1">المستوى الأول</option>
                        <option value="2">المستوى الثاني</option>
                        <option value="3">المستوى الثالث</option>
                        <option value="4">المستوى الرابع</option>
                        <option value="5">المستوى الخامس</option>
                        <option value="6">المستوى السادس</option>
                    </select>
                </div>

                <!-- المرحلة -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">المرحلة:</label>
                    <select id="stage-select" class="w-full border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option value="2">المرحلة الثانية</option>
                        <option value="3">المرحلة الثالثة</option>
                        <option value="4">المرحلة الرابعة</option>
                        <option value="5">المرحلة الخامسة</option>
                        <option value="6">المرحلة السادسة</option>
                    </select>
                </div>

                <!-- الأسبوع -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">الأسبوع:</label>
                    <select id="week-select" class="w-full border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option value="1">الأسبوع 1</option>
                        <option value="2">الأسبوع 2</option>
                        <option value="3">الأسبوع 3</option>
                        <option value="4">الأسبوع 4</option>
                        <option value="5">الأسبوع 5</option>
                        <option value="6">الأسبوع 6</option>
                    </select>
                </div>
            </div>

            <div class="mt-8 text-center">
                <button onclick="searchMindMap()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">
                    🔍 ابحث عن الخطاطة
                </button>
            </div>
        </div>

        <!-- النتيجة -->
        <div id="result-area" class="hidden text-center fade-in bg-blue-50 p-8 rounded-xl border border-blue-100">
            <p id="result-text" class="text-lg text-gray-700 mb-4"></p>
            <div class="p-8 border-2 border-dashed border-blue-300 rounded-lg bg-white">
                <p class="text-gray-400">سيتم عرض صورة الخطاطة أو ملف الـ PDF هنا.</p>
                <p class="text-sm text-gray-400 mt-2">(قم برفع صور الخطاطات لاحقاً في GitHub لربطها هنا)</p>
            </div>
        </div>

    </main>

    <script>
        let currentSubject = '';

        function selectSubject(subject) {
            currentSubject = subject;
            document.getElementById('selected-title').innerText = 'مادة: ' + subject;
            document.getElementById('selection-area').classList.remove('hidden');
            document.getElementById('result-area').classList.add('hidden');
        }

        function searchMindMap() {
            const level = document.getElementById('level-select').options[document.getElementById('level-select').selectedIndex].text;
            const stage = document.getElementById('stage-select').options[document.getElementById('stage-select').selectedIndex].text;
            const week = document.getElementById('week-select').options[document.getElementById('week-select').selectedIndex].text;
            
            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('result-text').innerHTML = `أنت تبحث عن: <strong>${currentSubject}</strong> - ${level} - ${stage} - ${week}`;
        }
    </script>
</body>
</html>
