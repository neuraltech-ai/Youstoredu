<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخطاطات الذهنية - YouStor Edu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- مكتبة PDF.js لعرض الملفات داخل التطبيق بدون نوافذ تحميل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-12 transition-colors duration-300">

    <!-- الهيدر مع زر الوضع الليلي -->
    <header class="bg-blue-600 dark:bg-slate-800 text-white py-6 px-4 shadow-md relative transition-colors duration-300">
        <div class="max-w-md mx-auto flex justify-between items-center mb-2">
            <span class="text-xs bg-blue-700 dark:bg-slate-700 px-3 py-1 rounded-full font-bold">YouStor Edu</span>
            <button onclick="toggleDarkMode()" id="theme-toggle-btn" class="bg-blue-700 dark:bg-slate-700 hover:bg-blue-800 dark:hover:bg-slate-600 text-white px-3.5 py-1.5 rounded-xl text-sm font-bold flex items-center gap-1.5 shadow-sm transition">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">الوضع الليلي</span>
            </button>
        </div>
        <div class="text-center mt-2">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide mb-1">منصة الخطاطات الذهنية</h1>
            <p class="text-blue-100 dark:text-slate-300 text-sm font-medium">لجميع المستويات الابتدائية</p>
        </div>
    </header>

    <!-- شريط تحميل التطبيق من الموقع -->
    <div class="max-w-md mx-auto px-4 mt-4">
        <a href="YouStor_Edu.apk" download class="flex items-center justify-between bg-gradient-to-l from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white p-3.5 rounded-2xl shadow-md transition transform active:scale-95">
            <div class="flex items-center gap-3">
                <span class="text-2xl bg-white/20 p-2 rounded-xl">📲</span>
                <div>
                    <p class="font-extrabold text-sm">تطبيق YouStor Edu للأندرويد</p>
                    <p class="text-xs text-blue-100">تصفح أسرع ووصول مباشر للخطاطات</p>
                </div>
            </div>
            <span class="bg-white text-blue-700 font-extrabold text-xs px-3 py-2 rounded-xl shadow-sm">
                تحميل APK
            </span>
        </a>
    </div>

    <!-- البطاقة الرئيسية -->
    <main class="max-w-md mx-auto p-6 mt-4 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 transition-colors duration-300">
        
        <div class="mb-6">
            <label class="block font-bold text-gray-800 dark:text-gray-100 text-lg mb-3">1. اختر المادة الدراسية:</label>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="selectSubject('اللغة الفرنسية')" id="sub-اللغة الفرنسية" class="py-3.5 px-4 rounded-xl font-bold text-base transition-all shadow-sm bg-blue-600 text-white">اللغة الفرنسية</button>
                <button onclick="selectSubject('اللغة العربية')" id="sub-اللغة العربية" class="py-3.5 px-4 rounded-xl font-bold text-base transition-all bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200">اللغة العربية</button>
                <button onclick="selectSubject('النشاط العلمي')" id="sub-النشاط العلمي" class="py-3.5 px-4 rounded-xl font-bold text-base transition-all bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200">النشاط العلمي</button>
                <button onclick="selectSubject('الرياضيات')" id="sub-الرياضيات" class="py-3.5 px-4 rounded-xl font-bold text-base transition-all bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200">الرياضيات</button>
            </div>
        </div>

        <div id="selectors-area" class="space-y-4">
            <div>
                <label class="block font-bold text-gray-800 dark:text-gray-200 mb-1.5">2. المستوى الدراسي:</label>
                <select id="level-select" onchange="searchMindMap()" class="w-full p-3.5 border border-gray-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700 text-gray-800 dark:text-white font-medium focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    <option value="1">المستوى الأول (1AEP)</option>
                    <option value="2" selected>المستوى الثاني (2AEP)</option>
                    <option value="3">المستوى الثالث (3AEP)</option>
                    <option value="4">المستوى الرابع (4AEP)</option>
                    <option value="5">المستوى الخامس (5AEP)</option>
                    <option value="6">المستوى السادس (6AEP)</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-800 dark:text-gray-200 mb-1.5">3. المرحلة:</label>
                <select id="stage-select" onchange="searchMindMap()" class="w-full p-3.5 border border-gray-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700 text-gray-800 dark:text-white font-medium focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    <option value="2" selected>المرحلة الثانية (P2 / الوحدة 1)</option>
                    <option value="3">المرحلة الثالثة (P3 / الوحدة 2)</option>
                    <option value="4">المرحلة الرابعة (P4 / الوحدة 3)</option>
                    <option value="5">المرحلة الخامسة (P5 / الوحدة 4)</option>
                    <option value="6">المرحلة السادسة (P6 / الوحدة 5)</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-800 dark:text-gray-200 mb-1.5">4. الأسبوع:</label>
                <select id="week-select" onchange="searchMindMap()" class="w-full p-3.5 border border-gray-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700 text-gray-800 dark:text-white font-medium focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    <option value="1" selected>الأسبوع الأول (S1)</option>
                    <option value="2">الأسبوع الثاني (S2)</option>
                    <option value="3">الأسبوع الثالث (S3)</option>
                    <option value="4">الأسبوع الرابع (S4)</option>
                    <option value="5">الأسبوع الخامس (S5)</option>
                    <option value="6">الأسبوع السادس (S6)</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-800 dark:text-gray-200 mb-1.5">5. الحصة:</label>
                <select id="session-select" onchange="searchMindMap()" class="w-full p-3.5 border border-gray-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700 text-gray-800 dark:text-white font-medium focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </select>
            </div>
        </div>

        <div id="result-area" class="mt-6 p-5 bg-blue-50/70 dark:bg-slate-700/60 border border-blue-100 dark:border-slate-600 rounded-2xl text-center hidden">
            <p id="result-text" class="font-bold text-blue-900 dark:text-blue-200 mb-4 text-sm leading-relaxed"></p>
            
            <div id="pdf-container" class="space-y-3">
                <button onclick="openPdfModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-sm transition">
                    🔍 معاينة الخطاطة (مباشرة)
                </button>
                <a id="download-btn" href="#" download class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-sm transition">
                    📥 تحميل الخطاطة (PDF)
                </a>
            </div>

            <p id="not-found-msg" class="text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 p-3 rounded-xl font-medium text-sm hidden">
                ⏳ هذه الخطاطة قيد الإعداد وسيتم رفعها قريباً.
            </p>
        </div>

    </main>

    <!-- نافذة المعاينة الداخلية الذكية (تعمل داخل التطبيق بدون تنزيل إجباري) -->
    <div id="pdf-modal" class="fixed inset-0 z-50 bg-black/85 hidden flex flex-col">
        <!-- شريط التحكم العلوي للمعاينة -->
        <div class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center shadow-md border-b border-slate-700">
            <div class="flex items-center gap-2">
                <button onclick="changeZoom(25)" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm font-bold">➕ تكبير</button>
                <span id="zoom-level" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded">100%</span>
                <button onclick="changeZoom(-25)" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm font-bold">➖ تصغير</button>
            </div>
            <button onclick="closePdfModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold">
                ✖ إغلاق
            </button>
        </div>

        <!-- منطقة عرض صفحات الـ PDF -->
        <div class="flex-1 overflow-auto p-3 text-center" id="pdf-scroll-Wrapper">
            <div id="pdf-loading" class="text-white font-bold py-16 text-center">
                ⏳ جاري فتح الخطاطة بدقة عالية...
            </div>
            <div id="pdf-pages-container" class="mx-auto"></div>
        </div>
    </div>

    <script>
        // إعداد مكتبة PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let currentSubject = 'اللغة الفرنسية';
        let currentPdfUrl = '';
        let currentZoom = 100;
        const subjects = ['اللغة الفرنسية', 'اللغة العربية', 'النشاط العلمي', 'الرياضيات'];

        // إدارة الوضع الليلي
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
            document.getElementById('theme-text').innerText = isDark ? 'الوضع النهاري' : 'الوضع الليلي';
        }

        function selectSubject(sub) {
            currentSubject = sub;
            subjects.forEach(s => {
                const btn = document.getElementById(`sub-${s}`);
                if (s === sub) {
                    btn.className = "py-3.5 px-4 rounded-xl font-bold text-base transition-all shadow-sm bg-blue-600 text-white";
                } else {
                    btn.className = "py-3.5 px-4 rounded-xl font-bold text-base transition-all bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200";
                }
            });
            updateSessionsList();
            searchMindMap();
        }

        function updateSessionsList() {
            const sessionSelect = document.getElementById('session-select');
            const currentVal = sessionSelect.value || "1";
            const maxSessions = (currentSubject === 'الرياضيات') ? 5 : 6;
            const sessionNames = ["الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة"];
            
            sessionSelect.innerHTML = '';
            for (let i = 1; i <= maxSessions; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `الحصة ${sessionNames[i-1]} (${i})`;
                sessionSelect.appendChild(opt);
            }

            if (parseInt(currentVal) <= maxSessions) {
                sessionSelect.value = currentVal;
            } else {
                sessionSelect.value = "1";
            }
        }

        const database = {

        function searchMindMap() {
            const level = document.getElementById('level-select').value;
            const stage = document.getElementById('stage-select').value;
            const week = document.getElementById('week-select').value;
            const session = document.getElementById('session-select').value;

            const searchID = `${currentSubject}-${level}-${stage}-${week}-${session}`;

            const resultArea = document.getElementById('result-area');
            const resultText = document.getElementById('result-text');
            const pdfContainer = document.getElementById('pdf-container');
            const downloadBtn = document.getElementById('download-btn');
            const notFoundMsg = document.getElementById('not-found-msg');

            resultArea.classList.remove('hidden');

            if (database[searchID]) {
                currentPdfUrl = database[searchID];
                resultText.innerText = `✅ الخطاطة متوفرة: ${currentSubject} | المستوى ${level} | المرحلة ${stage} | الأسبوع ${week} | الحصة ${session}`;
                
                downloadBtn.href = currentPdfUrl;
                pdfContainer.classList.remove('hidden');
                notFoundMsg.classList.add('hidden');
            } else {
                resultText.innerText = `${currentSubject} - المستوى ${level} - المرحلة ${stage} - الأسبوع ${week} - الحصة ${session}`;
                pdfContainer.classList.add('hidden');
                notFoundMsg.classList.remove('hidden');
            }
        }

        // فتح وعرض الـ PDF كصور فائقة الدقة داخل التطبيق دون تفعيل التحميل الإجباري
        async function openPdfModal() {
            if (!currentPdfUrl) return;
            const modal = document.getElementById('pdf-modal');
            const pagesContainer = document.getElementById('pdf-pages-container');
            const loadingIndicator = document.getElementById('pdf-loading');

            modal.classList.remove('hidden');
            pagesContainer.innerHTML = '';
            loadingIndicator.innerHTML = '⏳ جاري فتح الخطاطة بدقة عالية...';
            loadingIndicator.classList.remove('hidden');
            currentZoom = 100;
            document.getElementById('zoom-level').innerText = '100%';

            try {
                const loadingTask = pdfjsLib.getDocument(currentPdfUrl);
                const pdf = await loadingTask.promise;
                loadingIndicator.classList.add('hidden');

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const unscaledViewport = page.getViewport({ scale: 1 }); const safeScale = Math.min(2.2, 1800 / unscaledViewport.width); const viewport = page.getViewport({ scale: safeScale });
                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page-canvas mx-auto mb-4 shadow-lg rounded-lg bg-white';
                    canvas.style.width = currentZoom + '%';
                    canvas.style.maxWidth = 'none';
                    canvas.style.height = 'auto';

                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    pagesContainer.appendChild(canvas);
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                }
            } catch (error) {
                loadingIndicator.innerHTML = '❌ تعذر عرض المعاينة، يرجى التأكد من الاتصال بالإنترنت.';
            }
        }

        function closePdfModal() {
            document.getElementById('pdf-modal').classList.add('hidden');
            document.getElementById('pdf-pages-container').innerHTML = '';
        }

        function changeZoom(delta) {
            currentZoom = Math.min(300, Math.max(50, currentZoom + delta));
            document.getElementById('zoom-level').innerText = currentZoom + '%';
            const canvases = document.querySelectorAll('.pdf-page-canvas');
            canvases.forEach(c => {
                c.style.width = currentZoom + '%';
            });
        }

        initTheme();
        updateSessionsList();
        searchMindMap();
    </script>

<style>
    /* وضوح فائق للخطاطات مع تمرير سلس في جميع الاتجاهات عند التكبير */
    #pdf-pages-container {
        overflow: auto !important;
        -webkit-overflow-scrolling: touch !important;
        display: block !important;
        text-align: center !important;
        padding: 8px !important;
    }
    .pdf-page-canvas {
        max-width: none !important;
        height: auto !important;
        display: inline-block !important;
        margin: 0 auto !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        border-radius: 8px;
    }
</style>
<script>
(function() {
    // 1. إخفاء بطاقة تحميل الـ APK داخل التطبيق فقط وإبقاؤها في المتصفح
    function checkAndHideApkBanner() {
        var ua = navigator.userAgent || "";
        var isWebViewBrand = false;
        if (navigator.userAgentData && navigator.userAgentData.brands) {
            isWebViewBrand = navigator.userAgentData.brands.some(function(b) {
                return /WebView|wv/i.test(b.brand);
            });
        }
        var isApp = isWebViewBrand ||
                    /; wv\)|WebIntoApp|Version\/\d+\.\d+/i.test(ua) ||
                    window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true ||
                    document.referrer.indexOf('android-app://') !== -1;

        if (!isApp) return;

        // البحث عن البطاقة البنفسجية التي تحتوي على عبارة "تحميل APK" فقط دون المساس بباقي الصفحة
        var allDivs = document.querySelectorAll('div');
        allDivs.forEach(function(div) {
            var txt = div.innerText || "";
            if (txt.indexOf("APK") !== -1 && txt.indexOf("الأندرويد") !== -1 && txt.indexOf("اختر المادة") === -1) {
                if (div.querySelectorAll('select').length === 0) {
                    div.style.setProperty('display', 'none', 'important');
                }
            }
        });
    }
    checkAndHideApkBanner();
    document.addEventListener('DOMContentLoaded', checkAndHideApkBanner);
    window.addEventListener('load', checkAndHideApkBanner);

    // 2. دعم الخطوط العربية ومنع تقطع الحروف
    if (window.pdfjsLib) {
        var ver = pdfjsLib.version || '3.11.174';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + ver + '/pdf.worker.min.js';
        var origGetDoc = pdfjsLib.getDocument.bind(pdfjsLib);
        pdfjsLib.getDocument = function(src) {
            var params = (typeof src === 'string') ? { url: src } : Object.assign({}, src);
            params.cMapUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + ver + '/cmaps/';
            params.cMapPacked = true;
            params.standardFontDataUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + ver + '/standard_fonts/';
            params.isEvalSupported = false;
            return origGetDoc(params);
        };
    }

    // 3. تفريغ ذاكرة الصور بالكامل عند إغلاق المعاينة لمنع أي تشنج
    var origCloseModal = window.closePdfModal;
    window.closePdfModal = function() {
        document.querySelectorAll('.pdf-page-canvas, #pdf-pages-container canvas').forEach(function(c) {
            var ctx = c.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, c.width, c.height);
            c.width = 0;
            c.height = 0;
            c.remove();
        });
        if (origCloseModal) origCloseModal();
    };
})();
</script>
<!-- YOUSTOR_PRO_PATCH_END -->
