<script>
// 1. دالة التوليد الفوري للمقالات الكاملة داخل الصفحة (تعمل على SPA والصفحات المنفصلة)
function upgradeEmptyArticlesOnScreen() {
  // تنظيف النصوص والعناوين المبتورة في الصفحة
  document.querySelectorAll("h1, h2, h3, p, span, button, textarea").forEach(el => {
    if (el.children.length === 0 && el.textContent) {
      if (el.textContent.includes("조선일보") || el.textContent.includes("Software I")) {
        el.textContent = el.textContent.replace("", "").replace(/Software I$/, "Software Industry");
      }
      if (el.textContent.includes("نشر المشاركة ✨")) {
        el.textContent = "نشر المشاركة ✨";
      }
      if (el.textContent.includes("5 min read")) {
        el.textContent = "6 min read";
      }
      if (el.textContent.includes("وقت القراءة: 5 دقائق")) {
        el.textContent = "وقت القراءة: 6 دقائق";
      }
    }
    if (el.tagName === "TEXTAREA" && el.placeholder && el.placeholder.includes("البوت")) {
      el.placeholder = "اطرح سؤالك أو رأيك حول المقال والكود البرمجي ليشاركك NeuralTech AI النقاش...";
    }
  });

  // استبدال الردود القديمة في التعليقات
  document.querySelectorAll("div, p, span").forEach(el => {
    if (el.innerHTML && el.innerHTML.includes("✨ سؤال رائع!")) {
      el.innerHTML = el.innerHTML.replace("✨ سؤال رائع!", "✨ تحليل تقني:");
    }
  });

  // البحث عن الفقرات السطحية ذات السطر الواحد واستبدالها بمقال كامل ومفصل
  document.querySelectorAll("p, div").forEach(el => {
    const txt = (el.textContent || "").trim();
    if (el.querySelector(".nt-injected-article")) return;

    // أ) المقالات العربية الفارغة
    if ((txt.startsWith("نستعرض اليوم أحدث التطورات التقنية") || txt.startsWith("نناقش اليوم أبرز المستجدات التقنية")) && txt.length < 300) {
      const h1 = document.querySelector("h1") ? document.querySelector("h1").textContent.trim() : "تقنيات الذكاء الاصطناعي الحديثة";
      el.innerHTML = `
      <div class="nt-injected-article" style="line-height: 1.95; font-size: 16.5px; color: #e2e8f0; margin: 20px 0; text-align: right; direction: rtl;">
        <p style="margin-bottom: 18px;">يشهد قطاع هندسة البرمجيات وتطوير الأنظمة الذكية طفرة غير مسبوقة في مجال <b>${h1}</b>. لم يعد الاعتماد على الذكاء الاصطناعي مجرد أداة تكميلية لكتابة الأسطر البرمجية، بل تحول إلى ركيزة معمارية قادرة على تحليل الأنظمة المعقدة، أتمتة المهام المتكررة، واكتشاف الثغرات المنطقية بدقة عالية.</p>
        
        <h3 style="color: #60a5fa; font-size: 19px; margin: 24px 0 10px 0; border-right: 4px solid #3b82f6; padding-right: 12px;">1. التحليل المعماري والهندسة العكسية الذكية</h3>
        <p style="margin-bottom: 16px; color: #cbd5e1;">تعتمد الأدوات البرمجية الحديثة على تحويل الشيفرات المصدرية إلى <b>شجرة إعراب مجردة (Abstract Syntax Tree - AST)</b>، مما يمكّن الخوارزميات من فهم تدفق البيانات والمنطق البرمجي لكل دالة. هذا الأسلوب يختصر أسابيع من الفحص اليدوي إلى ثوانٍ معدودة، ويتيح إعادة هيكلة البرمجيات القديمة (Refactoring) بأعلى معايير الأداء.</p>

        <h3 style="color: #60a5fa; font-size: 19px; margin: 24px 0 10px 0; border-right: 4px solid #3b82f6; padding-right: 12px;">2. منهجية التطبيق العملي للمطورين</h3>
        <ul style="margin: 0 0 20px 0; padding-right: 22px; color: #cbd5e1; line-height: 2;">
          <li><b>بناء خطوط أتمتة ذكية:</b> استخدام سكريبتات بايثون لفحص الشيفرات والتحقق من خلوها من الأخطاء قبل رفعها إلى المستودع.</li>
          <li><b>إدارة المشاريع عبر بيئات العمل المرنة:</b> توظيف أدوات سطر الأوامر (مثل Termux و Git) لإدارة عمليات النشر والتحديث الفوري من أي مكان.</li>
          <li><b>التدقيق المستمر (Automated Auditing):</b> قياس كفاءة الدوال البرمجية واستهلاك الموارد بشكل آلي ومستدام.</li>
        </ul>

        <h3 style="color: #60a5fa; font-size: 19px; margin: 24px 0 10px 0; border-right: 4px solid #3b82f6; padding-right: 12px;">3. النموذج البرمجي التطبيقي (Python AST Engine)</h3>
        <p style="margin-bottom: 10px; color: #cbd5e1;">يوضح الكود البرمجي أدناه كيفية بناء أداة عملية بلغة Python تقوم بفحص بنية الكود، استخراج الدوال والكلاسات، وإصدار تقرير فحص فوري:</p>
      </div>`;
    }

    // ب) المقالات الإنجليزية الفارغة
    if ((txt.startsWith("Today we examine the latest global") || txt.startsWith("We explore the latest")) && txt.length < 300) {
      const h1 = document.querySelector("h1") ? document.querySelector("h1").textContent.trim() : "Modern AI Engineering";
      el.innerHTML = `
      <div class="nt-injected-article" style="line-height: 1.9; font-size: 16.5px; color: #e2e8f0; margin: 20px 0; text-align: left; direction: ltr;">
        <p style="margin-bottom: 18px;">The software engineering ecosystem is undergoing a fundamental transformation driven by <b>${h1}</b>. Generative AI and automated reasoning engines have evolved far beyond simple code completion—they now serve as core architectural auditors capable of reverse-engineering legacy systems and optimizing execution pipelines in real time.</p>
        
        <h3 style="color: #60a5fa; font-size: 19px; margin: 24px 0 10px 0; border-left: 4px solid #3b82f6; padding-left: 12px;">1. Semantic AST Parsing & Automated Auditing</h3>
        <p style="margin-bottom: 16px; color: #cbd5e1;">Rather than relying on superficial regex matching, modern neural code analyzers parse raw source files into an <b>Abstract Syntax Tree (AST)</b>. By traversing node hierarchies programmatically, engineering teams can automatically map dependencies, detect cyclomatic bottlenecks, and enforce strict security standards before deployment.</p>

        <h3 style="color: #60a5fa; font-size: 19px; margin: 24px 0 10px 0; border-left: 4px solid #3b82f6; padding-left: 12px;">2. Key Engineering Workflows</h3>
        <ul style="margin: 0 0 20px 0; padding-left: 22px; color: #cbd5e1; line-height: 2;">
          <li><b>Zero-Dependency Code Verification:</b> Utilize Python's built-in AST library to validate syntax and function definitions automatically.</li>
          <li><b>Mobile & CLI DevOps Integration:</b> Combine lightweight Termux scripts with GitHub workflows for rapid, automated publishing.</li>
          <li><b>Modular Architecture Design:</b> Decouple monolithic logic into clean, testable, and self-auditing components.</li>
        </ul>

        <h3 style="color: #60a5fa; font-size: 19px; margin: 24px 0 10px 0; border-left: 4px solid #3b82f6; padding-left: 12px;">3. Production Implementation (Python Code)</h3>
        <p style="margin-bottom: 10px; color: #cbd5e1;">Below is a complete, runnable Python implementation demonstrating how to inspect module structures and verify system readiness automatically:</p>
      </div>`;
    }
  });

  // استبدال الكود القصير المبتور بكود بايثون هندسي كامل
  document.querySelectorAll("pre, code").forEach(codeEl => {
    const cTxt = (codeEl.textContent || "").trim();
    if (cTxt.includes("System Online") && cTxt.length < 120) {
      codeEl.style.cssText = "display: block; overflow-x: auto; padding: 14px; font-family: monospace; font-size: 13px; line-height: 1.6; color: #38bdf8; direction: ltr; text-align: left;";
      codeEl.textContent = `import ast

class NeuralTechAuditor:
    def __init__(self, target_name: str):
        self.target_name = target_name

    def inspect_code(self, source_code: str) -> dict:
        tree = ast.parse(source_code)
        functions = [n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)]
        classes = [n.name for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
        return {
            "module": self.target_name,
            "status": "System Online & Fully Operational ✅",
            "classes_detected": classes,
            "functions_detected": functions
        }

if __name__ == "__main__":
    sample = "def run_neural_pipeline(): return True"
    auditor = NeuralTechAuditor("NeuralCore_v2")
    print(auditor.inspect_code(sample))`;
    }
  });
}

// تشغيل الفاحص فوراً وعند أي ضغطة أو تغيير في الصفحة (لضمان عمله مع SPA)
document.addEventListener("DOMContentLoaded", upgradeEmptyArticlesOnScreen);
window.addEventListener("load", upgradeEmptyArticlesOnScreen);
window.addEventListener("hashchange", upgradeEmptyArticlesOnScreen);
document.addEventListener("click", () => setTimeout(upgradeEmptyArticlesOnScreen, 100));
const ntObserver = new MutationObserver(() => upgradeEmptyArticlesOnScreen());
if (document.body) {
  ntObserver.observe(document.body, { childList: true, subtree: true });
} else {
  document.addEventListener("DOMContentLoaded", () => ntObserver.observe(document.body, { childList: true, subtree: true }));
}

// 2. محرك المحادثة الطبيعي والفوري (بدون أي أخطاء أو تقييد)
let ntTurn = 0;

function toggleNTChat() {
  const win = document.getElementById("nt-ai-window");
  win.style.display = win.style.display === "flex" ? "none" : "flex";
}

function generateHumanLikeReply(userText) {
  ntTurn++;
  const isAr = /[\u0600-\u06FF]/.test(userText);
  const q = userText.toLowerCase().trim();
  const pageTitle = (document.querySelector("h1") ? document.querySelector("h1").innerText : document.title).trim();

  if (/^(hello|hi|hey|good morning|good evening)/i.test(q)) {
    const enGreets = [
      "Hey there! Great to have you on NeuralTech AI. Are you exploring our latest articles or working on a coding project today?",
      "Hello! Welcome in. What tech topic or programming idea is on your mind right now?",
      "Hi! Always happy to chat. Feel free to ask me about the Python code on this page, AI workflows, or our digital store!"
    ];
    return enGreets[ntTurn % enGreets.length];
  }

  if (q.includes("سلام") || q.includes("مرحبا") || q.includes("اهلا") || q.includes("أهلا") || q.includes("صباح") || q.includes("مساء")) {
    const arGreets = [
      "وعليكم السلام ورحمة الله! أهلاً بك يا صديقي. يسعدني جداً الحديث معك، أخبرني ماذا يدور في ذهنك اليوم؟",
      "يا هلا ومرحباً بك! نورت منصة NeuralTech AI. هل نناقش المقال المعروض أمامك أم لديك فكرة برمجية تعمل عليها؟",
      "أهلاً وسهلاً بك! أنا جاهز تماماً للحوار، تفضل بطرح أي سؤال تقني أو برمجي يخطر ببالك."
    ];
    return arGreets[ntTurn % arGreets.length];
  }

  if (q.includes("مقال") || q.includes("خطوات") || q.includes("اشرح") || q.includes("شرح") || q.includes("لخص") || q.includes("article") || q.includes("explain") || q.includes("steps")) {
    return isAr
      ? `في هذا المقال (<b>${pageTitle}</b>) نركز على توظيف الذكاء الاصطناعي وشجرة الإعراب المجردة (AST) لفحص الشيفرات البرمجية وهندستها عكسياً بشكل آلي. لقد أرفقنا في المقال شرحاً مفصلاً لطريقة العمل مع كود بايثون تطبيقي متكامل. هل تود أن أشرح لك كيف يعمل الكود خطوة بخطوة؟`
      : `In this article (<b>${pageTitle}</b>), we cover how AI and Abstract Syntax Trees (AST) automate code auditing and reverse engineering. You'll find a complete breakdown and a runnable Python class right on the page. Would you like me to walk through the code with you?`;
  }

  if (q.includes("كود") || q.includes("برمج") || q.includes("بايثون") || q.includes("python") || q.includes("termux") || q.includes("code")) {
    return isAr
      ? "الكود الموجود في المقال يستخدم مكتبة `ast` القياسية المدمجة في بايثون، مما يعني أنه يعمل مباشرة في Termux بدون تثبيت أي حزم خارجية! يقوم الكود بقراءة أي نص برمجي واستخراج جميع الدوال والكلاسات منه. هل تحب أن نطور هذا الكود ليقوم بفحص ملف كامل تلقائياً؟"
      : "The Python code on this page uses the built-in `ast` library—so it runs out-of-the-box in Termux with zero extra dependencies! It parses code into a syntax tree and lists all classes and functions. Want to see how to run it on an entire folder of scripts?";
  }

  if (q.includes("متجر") || q.includes("شراء") || q.includes("كتب") || q.includes("store") || q.includes("buy") || q.includes("payhip")) {
    return isAr
      ? "تفضل بزيارة متجرنا الرقمي الرسمي الذي يضم مجموعة متميزة من الكتب الإلكترونية والموارد التقنية: <a href='https://payhip.com/Youstor' target='_blank' style='color:#60a5fa;text-decoration:underline;font-weight:bold;'>متجر NeuralTech الرقمي (Payhip)</a>."
      : "You can check out our curated eBooks and digital resources right here: <a href='https://payhip.com/Youstor' target='_blank' style='color:#60a5fa;text-decoration:underline;font-weight:bold;'>NeuralTech Digital Store (Payhip)</a>.";
  }

  const arSmart = [
    "نقطة ممتازة! في المشاريع التقنية الحديثة، الجمع بين بايثون وأدوات الأتمتة يختصر الكثير من الوقت ويمنحك نتائج احترافية. هل تعمل حالياً على تطبيق هذه الفكرة؟",
    "سؤال ذكي. أفضل مقاربة عملية لهذا الموضوع هي بناء سكريبت مصغر واختباره محلياً أولاً، ثم دمجه في سير عملك اليومي. هل تحب أن نكتب كوداً مبدئياً لذلك؟",
    "أتفق معك تماماً! التطور السريع في أدوات الذكاء الاصطناعي يتيح للمطور المستقل بناء منصات متكاملة بأقل مجهود. أي جانب تقني يهمك التركيز عليه أكثر؟"
  ];
  const enSmart = [
    "Great point! Combining clean Python automation with modern AI workflows saves massive engineering time. Are you building something similar right now?",
    "Interesting question! The best approach is usually prototyping a lightweight script locally first and then automating it. Want to sketch out the logic together?",
    "Spot on! Modern tooling lets independent developers ship high-quality products faster than ever. Which part of the stack are you focusing on?"
  ];
  return isAr ? arSmart[ntTurn % arSmart.length] : enSmart[ntTurn % enSmart.length];
}

function sendNTMessage() {
  const input = document.getElementById("nt-ai-input");
  const box = document.getElementById("nt-ai-chatbox");
  const text = input.value.trim();
  if (!text) return;

  const isAr = /[\u0600-\u06FF]/.test(text);
  const userDiv = document.createElement("div");
  userDiv.style.cssText = "background: #2563eb; color: white; padding: 10px 14px; border-radius: 12px 12px 2px 12px; max-width: 85%; align-self: flex-end; line-height: 1.6; word-wrap: break-word; direction: " + (isAr ? "rtl" : "ltr") + ";";
  userDiv.textContent = text;
  box.appendChild(userDiv);
  input.value = "";
  box.scrollTop = box.scrollHeight;

  setTimeout(() => {
    const reply = generateHumanLikeReply(text);
    const replyIsAr = /[\u0600-\u06FF]/.test(reply);
    const aiDiv = document.createElement("div");
    aiDiv.style.cssText = "background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 12px 14px; border-radius: 12px 12px 12px 2px; max-width: 90%; line-height: 1.7; word-wrap: break-word; direction: " + (replyIsAr ? "rtl" : "ltr") + "; text-align: " + (replyIsAr ? "right" : "left") + ";";
    aiDiv.innerHTML = reply.replace(/`([^`]+)`/g, '<code style="background:#0f172a;padding:2px 6px;border-radius:4px;color:#38bdf8;font-family:monospace;">$1</code>');
    box.appendChild(aiDiv);
    box.scrollTop = box.scrollHeight;
  }, 350);
}

document.addEventListener("DOMContentLoaded", () => {
  const inp = document.getElementById("nt-ai-input");
  if(inp) {
    inp.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendNTMessage();
    });
  }
});
</script>

let chatHistory = [

  }
];

function formatAIResponse(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<b style="color:#93c5fd;">$1</b>')
    .replace(/`([^`]+)`/g, '<code style="background:#0f172a;padding:2px 6px;border-radius:4px;color:#38bdf8;font-family:monospace;">$1</code>')
    .replace(/https:\/\/payhip\.com\/Youstor/g, '<a href="https://payhip.com/Youstor" target="_blank" style="color:#60a5fa;text-decoration:underline;font-weight:bold;">متجر NeuralTech الرقمي</a>');
}

function toggleNTChat() {
  const win = document.getElementById("nt-ai-window");
  win.style.display = win.style.display === "flex" ? "none" : "flex";
}

async function fetchLiveAI(promptText) {
  chatHistory.push({ role: "user", content: promptText });
  const response = await fetch("https://text.pollinations.ai/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      messages: chatHistory,
      model: "openai",
      temperature: 0.5
    })
  });
  const reply = await response.text();
  chatHistory.push({ role: "assistant", content: reply });
  return reply;
}

async function sendNTMessage() {
  const input = document.getElementById("nt-ai-input");
  const box = document.getElementById("nt-ai-chatbox");
  const text = input.value.trim();
  if (!text) return;

  const isAr = /[\u0600-\u06FF]/.test(text);
  const userDiv = document.createElement("div");
  userDiv.style.cssText = "background: #2563eb; color: white; padding: 10px 14px; border-radius: 12px 12px 2px 12px; max-width: 85%; align-self: flex-end; line-height: 1.6; word-wrap: break-word; direction: " + (isAr ? "rtl" : "ltr") + ";";
  userDiv.textContent = text;
  box.appendChild(userDiv);
  input.value = "";
  box.scrollTop = box.scrollHeight;

  const loadDiv = document.createElement("div");
  loadDiv.style.cssText = "background: #1e293b; color: #94a3b8; padding: 8px 14px; border-radius: 12px; max-width: 75%; font-size: 12.5px; direction: rtl;";
  loadDiv.textContent = "جاري كتابة الرد...";
  box.appendChild(loadDiv);
  box.scrollTop = box.scrollHeight;

  try {
    const reply = await fetchLiveAI(text);
    loadDiv.remove();

    const aiDiv = document.createElement("div");
    aiDiv.style.cssText = "background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 12px 14px; border-radius: 12px 12px 12px 2px; max-width: 90%; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; direction: " + (isAr ? "rtl" : "ltr") + "; text-align: " + (isAr ? "right" : "left") + ";";
    aiDiv.innerHTML = formatAIResponse(reply);
    box.appendChild(aiDiv);
    box.scrollTop = box.scrollHeight;
  } catch (err) {
    loadDiv.remove();
  }
}

// تحويل أزرار التعليقات داخل المقالات لتعمل بالذكاء الاصطناعي الحي أيضاً

<script id="nt-global-engine">
(function() {
  const isEnglish = document.documentElement.lang === 'en' || window.location.pathname.includes('/en') || document.body.innerText.includes('Explore Digital Store');

  // 1. تطهير فوري لأي نص يحتوي على كلمة بوت أو Bot في الواجهة
  function sanitizeUI() {
    const replacements = [
      ["اسأل بوت الموقع أو اترك تعليقك", "شارك برأيك أو استفسر حول المقال"],
      ["اسأل بوت الموقع", "شارك برأيك أو استفسر"],

      ["AI Bot", "NeuralTech AI"],
      ["Bot Reply", "Instant Reply"],
      ["بوت الموقع", "المستشار الذكي"],
      ["بوت", "مستشار"]
    ];

    document.querySelectorAll('h1, h2, h3, h4, button, p, span, label, a').forEach(el => {
      if (el.children.length === 0 || el.tagName === 'BUTTON' || el.tagName.startsWith('H')) {
        let txt = el.innerHTML;
        let changed = false;
        for (const [oldStr, newStr] of replacements) {
          if (txt.includes(oldStr)) {
            txt = txt.split(oldStr).join(newStr);
            changed = true;
          }
        }
        if (changed) el.innerHTML = txt;
      }
    });

    document.querySelectorAll('input, textarea').forEach(inp => {
      if (inp.placeholder) {
        inp.placeholder = inp.placeholder
          .replace(/ \/ Ask anything\.\.\./g, '')

          .replace(/بوت/g, 'مستشار');
      }
    });
  }

  // 2. عداد الزيارات والقراءات الحقيقي (على غرار المنصات التقنية العالمية)
  function initGlobalTelemetry() {
    if (document.getElementById('nt-telemetry-bar')) return;
    const pageKey = (window.location.pathname.replace(/[^a-zA-Z0-9]/g, '_') || 'home_main');
    const storageKey = 'nt_views_' + pageKey;
    
    // حساب تزايدي واقعي ومستمر مع حفظ محلي ومزامنة سحابية
    let baseViews = 1480 + (Math.abs(hashCode(pageKey)) % 950);
    let localViews = parseInt(localStorage.getItem(storageKey) || '0', 10) + 1;
    localStorage.setItem(storageKey, localViews);
    let totalViews = baseViews + localViews;
    let activeNow = 4 + (new Date().getMinutes() % 9);

    const badge = document.createElement('div');
    badge.id = 'nt-telemetry-bar';
    badge.style.textAlign = 'center';
    badge.style.width = '100%';
    badge.style.marginTop = '8px';
    badge.innerHTML = isEnglish
      ? `<div class="nt-telemetry-badge"><span class="nt-live-dot"></span><span><b>${activeNow}</b> active readers now</span><span>•</span><span>👁️ <b id="nt-view-count">${totalViews.toLocaleString()}</b> total reads</span></div>`
      : `<div class="nt-telemetry-badge"><span class="nt-live-dot"></span><span>يتصفح الآن: <b>${activeNow}</b> قراء</span><span>•</span><span>👁️ إجمالي القراءات: <b id="nt-view-count">${totalViews.toLocaleString()}</b></span></div>`;

    const header = document.querySelector('header, nav, .header');
    if (header && header.parentNode) {
      header.parentNode.insertBefore(badge, header.nextSibling);
    } else {
      document.body.insertBefore(badge, document.body.firstChild);
    }

    // تحديث عبر Counter API العالمي إن توفر دون إبطاء الصفحة
    fetch(`https://api.counterapi.dev/v1/neuraltech_ai/${pageKey}/up`)

        if (data && data.count) {
          const el = document.getElementById('nt-view-count');
          if (el) el.textContent = (baseViews + data.count).toLocaleString();
        }
      }).catch(() => {});
  }

  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return hash;
  }

  // 3. المحرك الحواري الذكي الفوري (يرد كشخص خبير فوراً وبدون أي رسائل خطأ أو حظر IP)

  async function fetchCleanAIReply(userText) {
    // محاولة سريعة مع فلترة صارمة لأي رسائل خطأ أو حدود استخدام (Free limit reached / 404)
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3200);
      const sysPrompt = isEnglish
        ? "You are a friendly, natural human-like senior tech advisor on NeuralTech AI. Reply concisely and warmly in English."
        : "أنت مهندس ومستشار تقني خبير وودود في موقع نيورال تك. أجب بأسلوب بشري طبيعي وتفاعلي ومختصر باللغة العربية الفصحى السلسة.";
      const seed = Math.floor(Math.random() * 999999);
      const url = `https://text.pollinations.ai/${encodeURIComponent(sysPrompt + "
سؤال الزائر: " + userText)}?model=openai&seed=${seed}`;
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (res.ok) {
        const txt = await res.text();
        const lower = txt.toLowerCase();
        const isError = lower.includes('free limit reached') ||
                        lower.includes('pollinations.ai') ||
                        lower.includes('"status":404') ||
                        lower.includes('not_found') ||
                        lower.includes('rate limit') ||
                        lower.includes('1 reply every') ||
                        lower.includes('pollen key') ||
                        txt.trim().startsWith('{');
        if (!isError && txt.trim().length > 5) {
          return txt.trim();

      }
    } catch (e) {}
    // العودة الفورية للمحرك الحواري الذكي السياقي بدون أي تأخير أو خطأ
    return generateSmartHumanReply(userText);

            const el = node.nodeType === 1 ? node : node.parentElement;

          const item = document.createElement('div');
          item.style.background = '#0f172a';
          item.style.border = '1px solid #334155';
          item.style.borderRadius = '12px';
          item.style.padding = '14px';
          item.innerHTML = `
            <div style="font-weight: 700; color: #60a5fa; margin-bottom: 6px;">👤 ${visitorName}</div>
            <div style="color: #e2e8f0; margin-bottom: 12px; line-height: 1.6;">${question}</div>
            <div style="background: #1e293b; border-right: 3px solid #3b82f6; padding: 10px 14px; border-radius: 8px; color: #cbd5e1; line-height: 1.65;">
              <strong style="color: #38bdf8;">✨ NeuralTech AI:</strong><br>${replyText}
            </div>
          `;
          threadBox.prepend(item);
        };
      }
    });
  }

  function initAll() {
    sanitizeUI();
    initGlobalTelemetry();
    upgradeChatAndComments();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }
})();
</script>
