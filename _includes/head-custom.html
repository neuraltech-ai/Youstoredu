    font-family: 'Tajawal', 'Inter', sans-serif;

<!-- NeuralTech Live Conversational AI -->
<div id="nt-ai-wrapper" style="position: fixed; bottom: 20px; right: 20px; z-index: 99999; font-family: system-ui, -apple-system, sans-serif;">
  <button id="nt-ai-trigger" onclick="toggleNTChat()" style="background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; border: 1px solid #3b82f6; border-radius: 50px; padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
    <span style="color: #60a5fa; font-size: 16px;">✨</span> <span>NeuralTech AI</span>
  </button>
  
  <div id="nt-ai-window" style="display: none; position: absolute; bottom: 58px; right: 0; width: 345px; max-width: 92vw; height: 460px; background: #0f172a; color: #f8fafc; border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.65); flex-direction: column; overflow: hidden; border: 1px solid #334155;">
    <div style="background: #1e293b; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="color: #60a5fa;">✨</span>
        <span style="font-weight: 700; font-size: 14px; letter-spacing: 0.3px;">NeuralTech AI</span>
        <span style="background: #10b981; width: 8px; height: 8px; border-radius: 50%; display: inline-block;" title="متصل الآن"></span>
      </div>
      <button onclick="toggleNTChat()" style="background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px;">✕</button>
    </div>
    
    <div id="nt-ai-chatbox" style="flex: 1; padding: 14px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;">
      <div style="background: #1e293b; border: 1px solid #334155; padding: 12px 14px; border-radius: 12px 12px 12px 2px; max-width: 88%; line-height: 1.7; color: #e2e8f0; direction: rtl; text-align: right;">
        أهلاً بك! أنا معك هنا على مدار الساعة. يمكنك محادثتي بالعربية أو الإنجليزية حول أي موضوع تقني، أو سؤالي عن المقالات والأكواد الموجودة في الصفحة!
      </div>
    </div>
    
    <div style="padding: 10px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155;">
      <input type="text" id="nt-ai-input" placeholder="تحدث معي بحرية... / Type a message..." style="flex: 1; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; outline: none; direction: auto;">
      <button onclick="sendNTMessage()" style="background: #2563eb; color: white; border: none; padding: 0 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;">إرسال</button>
    </div>
  </div>
</div>

<script>
let ntTurn = 0;

function toggleNTChat() {
  const win = document.getElementById("nt-ai-window");
  win.style.display = win.style.display === "flex" ? "none" : "flex";
}

function generateHumanLikeReply(userText) {
  ntTurn++;
  const isAr = /[\u0600-\u06FF]/.test(userText);
  const q = userText.toLowerCase().trim();
  const pageTitle = (document.querySelector("h1") ? document.querySelector("h1").innerText : document.title).trim();

  // 1. التحيات بالإنجليزية والعربية بأسلوب بشري طبيعي ومتجدد
  if (/^(hello|hi|hey|good morning|good evening|greetings)/i.test(q)) {
    const enGreets = [
      "Hey there! Great to have you on NeuralTech AI. Are you checking out our latest articles or working on a coding project today?",
      "Hello! Welcome in. What tech topic or programming idea is on your mind right now?",
      "Hi! Always happy to chat. Feel free to ask me about Python, AI workflows, or anything on this page!"
    ];
    return enGreets[ntTurn % enGreets.length];
  }

  if (q.includes("سلام") || q.includes("مرحبا") || q.includes("مرحبًا") || q.includes("اهلا") || q.includes("أهلا") || q.includes("صباح") || q.includes("مساء")) {
    const arGreets = [
      "وعليكم السلام ورحمة الله! أهلاً بك يا صديقي. يسعدني جداً الحديث معك، أخبرني ماذا يدور في ذهنك اليوم؟",
      "يا هلا ومرحباً بك! نورت موقع NeuralTech. هل تود أن نتناقش حول المقال المعروض أمامك أم لديك فكرة برمجية تعمل عليها؟",
      "أهلاً وسهلاً بك! أنا جاهز تماماً للحوار، تفضل بطرح أي سؤال تقني أو برمجي يخطر ببالك."
    ];
    return arGreets[ntTurn % arGreets.length];
  }

  // 2. السؤال عن الحال أو الهوية
  if (q.includes("كيف حالك") || q.includes("شخبارك") || q.includes("أخبارك") || q.includes("how are you")) {
    return isAr 
      ? "بخير والحمد لله، في أتم الجاهزية والنشاط!شكراً لسؤالك اللطيف. أنت كيف تسير أمورك ومشاريعك اليوم؟"
      : "I'm doing great and running at full speed, thanks for asking! How are your projects going today?";
  }

  if (q.includes("من أنت") || q.includes("من انت") || q.includes("عرفني بنفسك") || q.includes("who are you")) {
    return isAr
      ? "أنا المستشار الذكي الخاص بمنصة NeuralTech AI. صُممت لمرافقتك في تصفح الموقع، شرح الأكواد والمفاهيم الهندسية ببساطة، ومساعدتك في تطوير أعمالك البرمجية."
      : "I'm the conversational AI advisor here at NeuralTech AI. I'm here to discuss software architecture, explain code snippets, and help you build better tech projects.";
  }

  // 3. أسئلة حول المقال الحالي أو الخطوات أو الشرح
  if (q.includes("مقال") || q.includes("خطوات") || q.includes("اشرح") || q.includes("شرح") || q.includes("لخص") || q.includes("عما يتحدث") || q.includes("article") || q.includes("explain") || q.includes("steps") || q.includes("summary")) {
    return isAr
      ? `في هذه الصفحة نركز على موضوع <b>${pageTitle}</b>. الفكرة الأساسية تدور حول استخدام الذكاء الاصطناعي لتحليل الشيفرات البرمجية عبر شجرة الإعراب المجردة (AST) بدلاً من الفحص اليدوي المرهق، وقد أرفقنا في أسفل المقال كود بايثون عملياً يوضح كيفية تطبيق ذلك. هل ترغب أن أشرح لك كيف يعمل الكود سطراً بسطر؟`
      : `On this page, we're diving into <b>${pageTitle}</b>. The core concept is using AI and Abstract Syntax Trees (AST) to audit and reverse-engineer codebases automatically. Check out the Python class in the article—would you like me to break down how the code works step by step?`;
  }

  // 4. أسئلة عن الكود أو بايثون أو Termux
  if (q.includes("كود") || q.includes("برمج") || q.includes("بايثون") || q.includes("python") || q.includes("termux") || q.includes("code") || q.includes("script")) {
    return isAr
      ? "الجميل في الكود المرفق في المقال أنه يعتمد على مكتبة `ast` المدمجة في بايثون، أي أنك لا تحتاج لتثبيت أي مكتبات خارجية في Termux لتشغيله! فقط انسخ الكود وضعه في ملف `.py` وشغله ليفحص لك الدوال والكلاسات فوراً. هل جربت تشغيله أم تحب أن نعدل عليه معاً؟"
      : "The great thing about the Python code on this page is that it uses the built-in `ast` module—meaning zero external dependencies to install in Termux! You can copy it directly into a `.py` file and run it. Want to customize it for a specific task?";
  }

  // 5. أسئلة عن تحويل الهاتف لمحطة إنتاجية أو تطوير الموقع
  if (q.includes("هاتف") || q.includes("محطة") || q.includes("انتاجية") || q.includes("إنتاجية") || q.includes("طور") || q.includes("تطوير") || q.includes("موقع") || q.includes("phone") || q.includes("productivity") || q.includes("website")) {
    return isAr
      ? "لتحويل هاتفك إلى محطة عمل وإنتاجية حقيقية، السر يكمن في الجمع بين **Termux** (لإدارة ملفات Git وتشغيل سكريبتات بايثون) مع أتمتة النشر عبر **GitHub Pages**. بهذه الطريقة يمكنك إدارة موقع كامل وتحديث مقالاته وبناء أدوات رقمية في دقائق معدودة. ما هي الأداة التي تستخدمها حالياً بكثرة على هاتفك؟"
      : "Turning your phone into a real workstation comes down to combining **Termux**, **Python automation**, and **GitHub Pages**. With a few clean scripts, you can deploy updates, audit code, and manage digital products from anywhere. What part of your workflow are you looking to automate next?";
  }

  // 6. المتجر الرقمي والمنتجات
  if (q.includes("متجر") || q.includes("شراء") || q.includes("كتب") || q.includes("منتج") || q.includes("store") || q.includes("buy") || q.includes("payhip") || q.includes("shop")) {
    return isAr
      ? "بالتأكيد! جمعنا في متجرنا الرقمي مجموعة مختارة من الكتب الإلكترونية والموارد المصممة بعناية لتطوير المهارات والتميز. يمكنك تصفحها مباشرة من هنا: <a href='https://payhip.com/Youstor' target='_blank' style='color:#60a5fa;text-decoration:underline;font-weight:bold;'>متجر NeuralTech الرقمي (Payhip)</a>. أخبرني إذا لفت انتباهك شيء معين هناك!"
      : "Absolutely! You can explore our curated digital products and eBooks right here on our official store: <a href='https://payhip.com/Youstor' target='_blank' style='color:#60a5fa;text-decoration:underline;font-weight:bold;'>NeuralTech Digital Store (Payhip)</a>. Let me know what catches your eye!";
  }

  // 7. ردود المتابعة (نعم، أكمل، شكراً، رائع، كيف، لماذا...)
  if (q.includes("نعم") || q.includes("اكمل") || q.includes("أكمل") || q.includes("اشرح لي") || q.includes("تفضل") || q.includes("yes") || q.includes("sure") || q.includes("go ahead")) {
    return isAr
      ? "يسعدني ذلك! الفكرة ببساطة أننا نقوم بتمرير أي كود برمجي إلى دالة `ast.parse()`، وهي تقوم بتحويل النص إلى شجرة عناصر، ثم نلتقط منها أسماء الدوال `FunctionDef` والكلاسات `ClassDef` لنتأكد أن الكود سليم وخالٍ من الأخطاء قبل نشره في الموقع. هل تحب أن نطبق هذه الفكرة على سكريبت آخر لديك؟"
      : "Awesome! Essentially, `ast.parse()` converts raw code into a syntax tree in memory. We then walk through the tree nodes to verify every `FunctionDef` and `ClassDef` before deployment. Would you like to see how to add automated security checks to it as well?";
  }

  if (q.includes("شكر") || q.includes("ممتاز") || q.includes("رائع") || q.includes("جميل") || q.includes("احسنت") || q.includes("thank") || q.includes("great") || q.includes("nice")) {
    return isAr
      ? "العفو يا صديقي، هذا واجبي ويسعدني دائماً الحوار معك! هل هناك أي فكرة أخرى أو تفصيل تقني تود أن نغوص فيه الآن؟"
      : "You're very welcome! Always a pleasure chatting with you. Is there anything else you'd like to explore or build together?";
  }

  // 8. حوار ذكي ومتنوع لأي سؤال عام أو جديد بدون أي قوالب مكررة
  const arSmartConversational = [
    "نقطة مثيرة للاهتمام! في عالم الذكاء الاصطناعي والبرمجة الحديثة، التركيز الأساسي أصبح على تبسيط الخطوات المعقدة وتحويلها إلى مهام تلقائية توفر الوقت والجهد. هل تفكر في تطبيق هذا الأمر في مشروعك الحالي؟",
    "سؤال وجيه جداً. أفضل طريقة للتعامل مع هذا الجانب تقنياً هي البدء ببناء نموذج مصغر (Prototype) بلغة مرنة مثل بايثون واختباره عملياً، ثم توسيعه تدريجياً. هل تحب أن نقترح معاً خطة عملية سريعة للبدء؟",
    "أعجبني تفكيرك في هذه الزاوية! التطورات التقنية الحالية تمنح المطور المستقل أدوات كانت حكراً على الشركات الكبرى، خصوصاً عند دمج نماذج الذكاء الاصطناعي مع سكريبتات الأتمتة. ما رأيك أن نربط هذه الفكرة بمحتوى موقعك؟"
  ];

  const enSmartConversational = [
    "That's a great point! In modern software engineering, the key is breaking complex workflows down into clean, automated scripts that save time. Are you looking to integrate this into your current setup?",
    "Interesting question! The most effective approach is usually building a lightweight Python prototype first, testing it locally, and then scaling it up. Want to brainstorm a quick implementation plan?",
    "I like where you're going with this! Modern AI tooling gives independent developers massive leverage when combined with smart automation. How do you see this fitting into your next project?"
  ];

  return isAr ? arSmartConversational[ntTurn % arSmartConversational.length] : enSmartConversational[ntTurn % enSmartConversational.length];
}

async function sendNTMessage() {
  const input = document.getElementById("nt-ai-input");
  const box = document.getElementById("nt-ai-chatbox");
  const text = input.value.trim();
  if (!text) return;

  const isAr = /[\u0600-\u06FF]/.test(text);
  const userDiv = document.createElement("div");
  userDiv.style.cssText = "background: #2563eb; color: white; padding: 10px 14px; border-radius: 12px 12px 2px 12px; max-width: 85%; align-self: flex-end; line-height: 1.6; word-wrap: break-word; direction: " + (isAr ? "rtl" : "ltr") + ";";
  userDiv.textContent = text;
  box.appendChild(userDiv);
  input.value = "";
  box.scrollTop = box.scrollHeight;

  const loadDiv = document.createElement("div");
  loadDiv.style.cssText = "background: #1e293b; color: #94a3b8; padding: 8px 14px; border-radius: 12px; max-width: 75%; font-size: 12.5px; direction: " + (isAr ? "rtl" : "ltr") + ";";
  loadDiv.textContent = isAr ? "يكتب الآن..." : "Typing...";
  box.appendChild(loadDiv);
  box.scrollTop = box.scrollHeight;

  setTimeout(() => {
    loadDiv.remove();
    const reply = generateHumanLikeReply(text);
    const replyIsAr = /[\u0600-\u06FF]/.test(reply);
    const aiDiv = document.createElement("div");
    aiDiv.style.cssText = "background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 12px 14px; border-radius: 12px 12px 12px 2px; max-width: 90%; line-height: 1.7; word-wrap: break-word; direction: " + (replyIsAr ? "rtl" : "ltr") + "; text-align: " + (replyIsAr ? "right" : "left") + ";";
    aiDiv.innerHTML = reply.replace(/`([^`]+)`/g, '<code style="background:#0f172a;padding:2px 6px;border-radius:4px;color:#38bdf8;font-family:monospace;">$1</code>').replace(/\*\*(.*?)\*\*/g, '<b style="color:#93c5fd;">$1</b>');
    box.appendChild(aiDiv);
    box.scrollTop = box.scrollHeight;
  }, 450);
}

document.addEventListener("DOMContentLoaded", () => {
  const inp = document.getElementById("nt-ai-input");
  if(inp) {
    inp.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendNTMessage();
    });
  }
});
</script>
