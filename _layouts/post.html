<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ar' }}" dir="{% if page.lang == 'en' %}ltr{% else %}rtl{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-light: #64748b; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.8; }
        header { background: var(--card-bg); border-bottom: 1px solid #e2e8f0; padding: 1.2rem; text-align: center; }
        header a { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 2rem 1.5rem; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h1 { color: var(--text); margin-top: 0.5rem; line-height: 1.4; }
        .meta { color: var(--text-light); font-size: 0.9rem; margin-bottom: 2rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem; }
        .badge { background: #dbeafe; color: #1e40af; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; }
        .content h2, .content h3 { color: var(--primary); margin-top: 1.8rem; }
        .content ul, .content ol { padding-inline-start: 1.5rem; }
        .content p { margin-bottom: 1.2rem; }
        footer { text-align: center; padding: 2rem; color: var(--text-light); font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <a href="/">🏠 العودة إلى الصفحة الرئيسية</a>
    </header>
    <div class="container">
        <span class="badge">{{ page.categories | first | default: 'تقنية' }}</span>
        <h1>{{ page.title }}</h1>
        <div class="meta">تاريخ النشر: {{ page.date | date: "%Y-%m-%d" }}</div>
        <div class="content">
            {{ content }}
        </div>
    </div>
    <footer>
        <p>&copy; 2026 {{ site.title }}</p>
    </footer>
</body>
</html>
